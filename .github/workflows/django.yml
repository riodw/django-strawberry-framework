name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least privilege by default: every job in this workflow reads the repository and
# nothing more. A job that genuinely needs a wider scope re-declares `permissions`
# at the job level, which REPLACES this block rather than adding to it -- so the
# grant stays visible next to the step that consumes it (spec-049 Decision 3).
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, so the checkout credential has no consumer.
          # Leaving it persisted in .git/config would expose it to every later
          # step (including the linters' own dependency tree).
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          # Distinct cache namespace per setup-uv job: lint / test / pages otherwise
          # share one key on Python 3.12.3 + the same uv.lock and race to save it
          # (and overwrite each other's pruned cache content).
          cache-suffix: lint
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Ruff Check
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .
      - name: Trailing-comma layout (>=4 elements; models.py >=2)
        run: uv run python scripts/check_trailing_commas.py --check

      - name: Citations resolve (AGENTS.md rule 27 path::Symbol refs)
        # Every `path.py::Symbol` reference in first-party source and on the board
        # must name a file that exists and a symbol that file still defines. The
        # `check-citations` pre-commit hook runs the same sweep on every commit;
        # this step is the backstop for commits made with hooks skipped.
        run: uv run python scripts/check_citations.py --check

      - name: Kanban tracked-path constants
        # Parity with the `kanban-tracked-path-constants` pre-commit hook, which
        # REWRITES the constants module rather than reporting on it. A commit
        # that adds or removes a tracked package/test path without regenerating
        # leaves the module stale on main, and the next contributor's hook then
        # fails on a diff they did not create. Enforcing the same invariant on
        # push keeps that cost on the commit that caused it.
        run: uv run python scripts/build_kanban_tracked_path_constants.py --check

      - name: Generated docs match their generators
        # Every one of these files is script-rendered from the fakeshop DB or
        # from module docstrings, and hand edits to them are silently discarded
        # by the next render. `--check` writes nothing; it fails when a
        # committed copy no longer matches what its generator produces, naming
        # the stale file. Kanban Pages publishes FRESHLY rendered copies of the
        # first three, so without this gate the published board and the
        # committed board can disagree with nothing reporting it. The step stops
        # at the first stale file.
        run: |
          uv run python scripts/build_kanban_md.py --check
          uv run python scripts/build_kanban_html.py --check
          uv run python scripts/build_glossary_md.py --check
          uv run python scripts/build_tree_md.py --check

  test:
    name: Python ${{ matrix.python }} - Django ${{ matrix.django }} - ${{ matrix.database }}${{ matrix.compatibility_only == '1' && ' [compatibility floor]' || '' }}
    runs-on: ubuntu-latest
    # Inherits the workflow-level `contents: read`. This job used to grant
    # `contents: write`; the only token consumer is the Coveralls upload, which
    # authenticates a coverage report and never writes to the repository, so the
    # write scope was unused authority (spec-049 Decision 3).
    timeout-minutes: 45
    strategy:
      # If one version fails, don't stop the others
      fail-fast: false
      matrix:
        # Manual dispatch (workflow_dispatch) runs the full matrix AND exercises
        # both the default single-DB settings and the sharded fakeshop DATABASES
        # layout (FAKESHOP_SHARDED=1) on every Python/Django node — the multi-DB
        # contract is gated only at the dispatch tier so push/PR feedback stays
        # fast. Push/PR runs only the minimum-support combo and the latest combo,
        # single-DB only (covers both ends without doubling CI wall-clock).
        #
        # `compatibility_only: "1"` marks the exact-Django-5.2.16 nodes. They
        # prove the ADVERTISED API FLOOR still imports and behaves -- a
        # compatibility contract. 5.2.16 is itself a patched release -- it
        # carries the security fixes that the superseded 5.2.0 floor predated --
        # so this cell installs nothing under a published advisory today. That
        # does NOT make the cell a secure-deployment statement: a floor is a
        # point-in-time API claim, and the next Django security release makes it
        # older than the newest patch again. So the label stays -- this cell must
        # never be cited as a supported deployment target, copied into a
        # deployment example, or used to argue that pinning the floor exactly is
        # a safe deployment choice. Compatibility support and secure-deployment
        # support are different contracts (spec-049 Decision 2). The dependency
        # audit scans the `uv.lock` resolution, never this pinned-floor
        # environment, so the cell cannot turn the audit red either
        # (spec-049 Decision 5).
        #
        # The minimum-support nodes (Django 5.2.16 / Python 3.10) also
        # force-install exactly strawberry-graphql==0.316.0 so the advertised
        # per-operation extension-isolation floor (spec-044 Decision 6) is
        # durably exercised on every push/PR, coverage-free (the latest node
        # keeps the coverage gate).
        include: >-
          ${{ github.event_name == 'workflow_dispatch' && fromJSON('[
            {"django": "5.2.16", "python": "3.10", "database": "single DB", "fakeshop_sharded": "0", "strawberry": "0.316.0", "compatibility_only": "1"},
            {"django": "5.2.16", "python": "3.10", "database": "multi DB", "fakeshop_sharded": "1", "strawberry": "0.316.0", "compatibility_only": "1"},
            {"django": "5.2.*", "python": "3.11", "database": "single DB", "fakeshop_sharded": "0"},
            {"django": "5.2.*", "python": "3.11", "database": "multi DB", "fakeshop_sharded": "1"},
            {"django": "5.2.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0"},
            {"django": "5.2.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1"},
            {"django": "5.2.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0"},
            {"django": "5.2.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1"},
            {"django": "6.0.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0"},
            {"django": "6.0.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1"},
            {"django": "6.0.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0"},
            {"django": "6.0.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1"},
            {"django": "6.0.*", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0"},
            {"django": "6.0.*", "python": "3.14", "database": "multi DB", "fakeshop_sharded": "1"},
            {"django": "6.1.*", "python": "3.12", "database": "single DB", "fakeshop_sharded": "0"},
            {"django": "6.1.*", "python": "3.12", "database": "multi DB", "fakeshop_sharded": "1"},
            {"django": "6.1.*", "python": "3.13", "database": "single DB", "fakeshop_sharded": "0"},
            {"django": "6.1.*", "python": "3.13", "database": "multi DB", "fakeshop_sharded": "1"},
            {"django": "latest", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0", "coverage": "1"},
            {"django": "latest", "python": "3.14", "database": "multi DB", "fakeshop_sharded": "1"}
          ]') || fromJSON('[
            {"django": "5.2.16", "python": "3.10", "database": "single DB", "fakeshop_sharded": "0", "strawberry": "0.316.0", "compatibility_only": "1"},
            {"django": "latest", "python": "3.14", "database": "single DB", "fakeshop_sharded": "0", "coverage": "1"}
          ]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes; the Coveralls upload authenticates with
          # GITHUB_TOKEN from the step env, not with the checkout credential.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          # One cache per matrix node: nodes sharing a Python (e.g. several 3.12
          # combos on a full dispatch) would otherwise share a key and race / thrash.
          cache-suffix: test-${{ matrix.python }}-${{ matrix.django }}-${{ matrix.fakeshop_sharded }}

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }}

      - name: Install Django ${{ matrix.django }}
        # ``--upgrade-package Django`` is not redundant with the pin beside it:
        # a bare constraint is a no-op whenever the synced version already
        # satisfies it, so ``Django==5.2.*`` resolves to the newest 5.2 patch on
        # Python 3.12+ (where uv.lock gives 6.0.x) but leaves 3.11 on the locked
        # 5.2.16 -- one matrix label, two versions under test. Scoping the
        # upgrade to Django alone, rather than a bare ``--upgrade``, keeps every
        # transitive pin at its uv.lock version.
        run: |
          if [ "${{ matrix.django }}" == "latest" ]; then
            uv pip install --upgrade-package Django "Django"
          else
            uv pip install --upgrade-package Django "Django==${{ matrix.django }}"
          fi
          uv run --no-sync django-admin --version

      - name: Install Strawberry ${{ matrix.strawberry }} (minimum supported floor)
        # Only the minimum-support nodes pin the exact floor; the other nodes run
        # the uv.lock-resolved (latest compatible) strawberry-graphql. Recording
        # the resolved version makes the exercised floor auditable in the log.
        #
        # Both ends are load-bearing, and the TOP end is the one that is easy to
        # lose: the WebSocket transport wraps whichever schema attribute upstream's
        # protocol handlers dispatch an operation's results through, and upstream
        # has renamed that attribute inside the supported range (0.319.0 moved
        # graphql-transport-ws from `subscribe` + `execute` to `stream`). An
        # unwrapped rename is silent -- the delegating wrapper forwards it to the
        # real schema and the protocol keeps working, minus the masking and the
        # revocation stop. `tests/test_routers.py` re-derives the read set from the
        # INSTALLED handler modules and fails on a name the wrapper does not cover,
        # so what protects consumers is that some node runs the top of the range:
        # a stale `uv.lock` makes every unpinned node another floor run and the
        # tripwire silent. Dependabot's weekly `uv` PR is what keeps the lock at the
        # top (.github/dependabot.yml), and that PR going red IS the intended
        # notification -- do not pin strawberry-graphql on the coverage node to
        # float, which would move the alarm onto main.
        if: matrix.strawberry
        run: |
          uv pip install "strawberry-graphql==${{ matrix.strawberry }}"
          uv run --no-sync python -c "import importlib.metadata as m; print('strawberry-graphql', m.version('strawberry-graphql'))"

      - name: Run Tests (${{ matrix.database }})
        # The latest single-DB node owns the fail_under=100 coverage gate and
        # Coveralls upload. Compatibility nodes run the identical test selection
        # without tracing it again: Coverage.py 7.14 uses its fast sys.monitoring
        # core on Python 3.14, while Python <=3.13 must use the much slower
        # sys.settrace core. `-o addopts` replaces pytest.ini's addopts wholesale,
        # so the compatibility branch drops --cov without --no-cov's warning.
        env:
          FAKESHOP_SHARDED: ${{ matrix.fakeshop_sharded }}
        run: |
          if [ "${{ matrix.coverage }}" = "1" ]; then
            addopts="-v -n auto --dist loadscope --cov --cov-report=term-missing --durations=25"
          else
            addopts="-v -n auto --dist loadscope --durations=25"
          fi
          uv run --no-sync pytest -o addopts="$addopts"

      - name: Upload Coverage to Coveralls
        # Only upload from the primary matrix node to avoid duplicate builds.
        if: >-
          github.ref == 'refs/heads/main' &&
          matrix.coverage == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv pip install coveralls
          uv run --no-sync coveralls
