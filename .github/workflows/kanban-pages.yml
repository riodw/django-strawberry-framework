name: Kanban Pages

on:
  push:
    branches: ["main"]
    # Regenerate-and-deploy: the build job re-runs the export scripts against the
    # fakeshop GraphQL schema + db.sqlite3, so this tracks the rendering INPUTS (data,
    # scripts, GraphQL schema/models, config) — NOT the regenerated outputs
    # (KANBAN.md/html, docs/GLOSSARY.md), which the job overwrites. Migrations/tests
    # under the app globs are excluded (they never change the rendered board); a package
    # or other engine change that does alter rendering is republished via the next
    # input change or a manual workflow_dispatch.
    paths:
      - ".github/workflows/kanban-pages.yml"
      - "examples/fakeshop/db.sqlite3"
      - "examples/fakeshop/config/**"
      - "examples/fakeshop/apps/kanban/**"
      - "!examples/fakeshop/apps/kanban/migrations/**"
      - "!examples/fakeshop/apps/kanban/tests/**"
      - "examples/fakeshop/apps/glossary/**"
      - "!examples/fakeshop/apps/glossary/migrations/**"
      - "!examples/fakeshop/apps/glossary/tests/**"
      - "scripts/build_glossary_md.py"
      - "scripts/build_kanban_html.py"
      - "scripts/build_kanban_md.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The Pages artifact is built from the checked-out tree and uploaded;
          # nothing pushes back, so the credential is not persisted.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Own cache namespace: this build runs on Python 3.12.3 like the django.yml
          # lint job and would otherwise share its setup-uv cache key and race to save
          # it whenever both workflows run on the same push.
          cache-suffix: pages

      - name: Install dependencies
        # The render scripts initialize the full fakeshop Django project, whose
        # schema imports the example DRF serializers; use the normal dev sync
        # rather than the package-only ``--no-dev`` environment.
        run: uv sync --python 3.12

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare static site
        run: |
          mkdir -p _site/docs
          cp KANBAN.html _site/index.html
          uv run python scripts/build_kanban_html.py --html _site/index.html
          uv run python scripts/build_kanban_md.py --md _site/KANBAN.md
          uv run python scripts/build_glossary_md.py --md _site/docs/GLOSSARY.md
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Must exceed the deploy step's own polling timeout below, so that a Pages
    # backend slower than the poller is reported BY the action (a named
    # deployment timeout) instead of being killed mid-poll by the job. Equal
    # values race, and the job kill wins: the action's cleanup then cancels a
    # deployment the backend may still go on to publish, leaving the run red
    # over a site that updated anyway.
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          # How long to poll the Pages API for the deployment to leave
          # ``deployment_in_progress``. The action's own default is 10 minutes,
          # which is under the publish latency Pages reaches while degraded --
          # and a deployment abandoned at the poll ceiling can still publish
          # afterwards, so a too-low ceiling reports failure for work that
          # landed. The ceiling bounds how long a genuinely stuck deployment
          # holds the ``github-pages`` concurrency group, nothing else.
          timeout: 1200000
