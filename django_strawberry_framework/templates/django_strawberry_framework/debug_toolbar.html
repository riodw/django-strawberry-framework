<script>
  (function (JSON, Response) {
    // debug-toolbar>=7 defaults USE_SHADOW_DOM=True: #djDebug lives inside
    // #djDebugRoot's shadow tree. Mirror stock getDebugElement() so panel /
    // data-request-id updates still reach the handle; light-DOM fallback keeps
    // USE_SHADOW_DOM=False consumers working.
    function getDjDebug() {
      const rootEl = document.getElementById("djDebugRoot");
      if (rootEl !== null && rootEl.shadowRoot) {
        return rootEl.shadowRoot.querySelector("#djDebug");
      }
      return document.getElementById("djDebug");
    }

    // The one question every read below depends on: can keys be read from this
    // value without a TypeError? Defined once and applied at every read site,
    // so the guards answer that question rather than enumerating spellings of
    // bad input (a null payload, a scalar, a missing "panels", a panel entry
    // that is not an object) - an enumeration always misses one, and a miss
    // throws out of the globally patched JSON.parse / Response.prototype.json
    // and breaks the caller's parse.
    function isRecord(value) {
      return value !== null && typeof value === "object";
    }

    const djDebug = getDjDebug();
    function update(data) {
      if (
        !isRecord(data) ||
        !Object.prototype.hasOwnProperty.call(data, "debugToolbar")
      ) {
        return data;
      }

      // Payload scrubbing is mandatory; DOM updates are best-effort. Capture the
      // debug payload and strip the server-only "debugToolbar" key BEFORE any
      // DOM-dependent work, so a missing toolbar handle - a payload shape the
      // DOM update cannot read - or a panel present in the payload whose
      // content/nav node is absent from the current toolbar DOM can never leak
      // the key back into the GraphiQL response.
      const toolbar = data.debugToolbar;
      delete data.debugToolbar;

      if (djDebug === null) return data;
      if (!isRecord(toolbar) || !isRecord(toolbar.panels)) return data;

      Object.entries(toolbar.panels).forEach(([panelId, panel]) => {
        if (!isRecord(panel)) return;
        // A panel key is arbitrary payload text, so it reaches querySelector
        // only through CSS.escape - the one form the selector parser accepts
        // for every key, rather than an enumeration of the spellings it
        // rejects (an unescaped key that is not a valid CSS identifier throws
        // a SyntaxError out of the globally patched JSON.parse /
        // Response.prototype.json and breaks the caller's parse). The escape
        // of an empty key is the empty identifier, which can name no node, so
        // that panel is skipped exactly as one whose content node is absent is.
        const id = CSS.escape(panelId);
        if (id === "") return;
        if (panel.title) {
          const content = djDebug.querySelector(`#${id}`);
          if (content === null) return;
          const panelTitle = content.querySelector(".djDebugPanelTitle");
          if (panelTitle !== null) {
            const heading = panelTitle.querySelector("h3");
            if (heading !== null) {
              heading.textContent = panel.title;
            }
          }

          const scroll = content.querySelector(".djdt-scroll");
          if (scroll !== null) {
            scroll.innerHTML = "";
          }

          const loader = content.querySelector(".djdt-loader");
          if (loader === null) {
            const panelContent = content.querySelector(".djDebugPanelContent");
            if (panelContent !== null) {
              const newLoader = document.createElement("div");
              newLoader.className = "djdt-loader";
              panelContent.prepend(newLoader);
            }
          }
        }
        if (panel.subtitle) {
          // Nav buttons are descendants of #djDebug (same shadow/light tree).
          const nav = djDebug.querySelector(`#djdt-${id}`);
          if (nav !== null) {
            const subtitle = nav.querySelector("small");
            if (subtitle !== null) {
              subtitle.textContent = panel.subtitle;
            }
          }
        }
      });
      // setAttribute coerces a non-string value and never throws for one, so a
      // missing requestId degrades to the stock toolbar's own panel-miss
      // fallback rather than a broken parse - upstream's write, kept.
      djDebug.setAttribute("data-request-id", toolbar.requestId);

      return data;
    }

    const origParse = JSON.parse;
    JSON.parse = function () {
      return update(origParse.apply(this, arguments));
    };

    const origJson = Response.prototype.json;
    Response.prototype.json = function () {
      return origJson.apply(this, arguments).then((data) => update(data));
    };

  })(JSON, Response);
</script>
