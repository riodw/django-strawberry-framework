[build-system]
# PEP 639 ``license`` expression + ``license-files`` need hatchling 1.27.
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

# The one version source: hatchling reads ``__version__`` from the package
# init (default regex source) for sdist/wheel metadata and any direct build.
[tool.hatch.version]
path = "django_strawberry_framework/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["django_strawberry_framework"]

# The PyPI long description is README.md with its repo-relative links pointed at
# GitHub, so they resolve on the PyPI page while the file in the repo keeps
# relative links. Anchors and absolute URLs pass through unchanged.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Reference-style definitions: ``[label]: docs/README.md``.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^(\[[^\]]+\]):[ \t]+(?!https?://|mailto:|#)(\S+)'
replacement = '\1: https://github.com/unaxy/django-strawberry-framework/blob/main/\2'

# Inline links: ``[text](docs/README.md)``.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)\s]+)\)'
replacement = '](https://github.com/unaxy/django-strawberry-framework/blob/main/\1)'

[tool.hatch.build.targets.sdist]
# Ship the package, tests, and key metadata only. Without this, hatchling's default
# sdist tars the whole tree — internal docs/SPECS, examples/ (with sqlite DBs), and
# any local .claude/ state — into a ~7 MB archive.
include = [
    "/django_strawberry_framework",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[project]
name = "django-strawberry-framework"
# Read from ``django_strawberry_framework/__init__.py`` by ``[tool.hatch.version]``.
# ``readme`` is built by the fancy-pypi-readme hook above.
dynamic = ["version", "readme"]
description = "A DRF-inspired Django integration framework for Strawberry GraphQL — filtering, ordering, aggregation, and permissions"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Unaxy" },
]
keywords = ["django", "strawberry", "graphql", "filters", "framework", "drf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dependencies = [
    "Django>=5.2.16",
    # 0.322.2 is the first release whose ``SliceMetadata.from_arguments`` ends a
    # ``first`` + ``before`` page at the cursor (``end = min(end, start + first)``);
    # 0.316.0 through 0.322.1 start that page one row before the cursor and ignore
    # ``after``, and ``utils/connections.py::page_arguments`` turns every
    # ``before`` page without ``first``/``last`` into ``first=cap``. The floor also
    # keeps per-operation extension isolation (spec-044 Decision 6, from 0.316.0):
    # earlier releases cache class-created sync extensions on
    # ``Schema._sync_extensions``, so concurrent requests share one instance's
    # engine-owned ``execution_context``.
    "strawberry-graphql>=0.322.2",
    # Strawberry allows ``graphql-core<3.4.0``, but 3.3.0 rewrites execution into
    # ``graphql.execution.executor`` and drops ``ExecutionContext`` from
    # ``graphql.execution.execute``, which ``schema.py`` imports and
    # ``_graphql_core_patches`` patches. Every 3.2.x release (3.2.0 through 3.2.13)
    # carries each graphql-core name the package imports; the floor is Strawberry's own.
    "graphql-core>=3.2.0,<3.3",
    "django-filter>=25.2",
    # ``typing_extensions.override`` marks every method that overrides a base
    # (``typing.override`` is 3.12+); 4.4.0 is the release that added it.
    "typing-extensions>=4.4.0",
]

[project.urls]
Homepage = "https://github.com/unaxy/django-strawberry-framework"
Repository = "https://github.com/unaxy/django-strawberry-framework"
Issues = "https://github.com/unaxy/django-strawberry-framework/issues"

[dependency-groups]
dev = [
    # Soft dependencies of the package: never in [project].dependencies; installed
    # here so the present-path tests run.
    # The [daphne] extra is needed only to import channels.testing (spec-041 Decision 5).
    "channels[daphne]>=4.3.2",
    # Only Meta.cursor_field needs AES-SIV.
    "cryptography>=44.0.0",
    # 7.0.0 is the first release carrying the Framework :: Django :: 6.0 classifier
    # the package advertises (spec-042 Decision 5).
    "django-debug-toolbar>=7.0.0",
    "djangorestframework>=3.17.0",
    # Fakeshop: faker seeds the example data, pillow backs its ImageFields.
    "faker>=33.0.0",
    "pillow>=10.0.0",
    # Test runner.
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    # 4.13.0 first exports ``pytest_django.Settings``, the settings fixture's type.
    "pytest-django>=4.13.0",
    "pytest-xdist>=3.8.0",
    # tests/test_ci_governance.py parses .github/workflows/*.yml (spec-049 Decision 6).
    "pyyaml>=6.0.2",
    # Lint and types.
    "basedpyright>=1.40.1",
    # ``py.typed`` makes the package's annotations public; the stubs make Django
    # and DRF types real rather than ``Any``.
    "django-stubs>=6.0.9",
    # The fakeshop settings call its ``monkeypatch()`` so example classes can
    # subscript ``admin.ModelAdmin[Card]`` / ``forms.ModelForm[Item]``.
    "django-stubs-ext>=6.0.9",
    "djangorestframework-stubs>=3.18.0",
    "ruff>=0.17.0",
    # typeshed stubs: each release names the upstream line it covers (``4.3.*`` /
    # ``26.1.*``), so bump it with the library.
    "types-channels>=4.3.0.20260518",
    "types-django-filter>=26.1.0.20260906",
    # Scripts.
    # The scripts run on the 3.10 floor cell, where the stdlib ``tomllib`` does not exist.
    "tomli>=2.4.1",
]
# Postgres test tier (opt-in): ``uv sync --group pg`` adds the driver the
# ``FAKESHOP_PG_DSN`` settings branch needs. Kept out of ``dev`` so the
# default sqlite workflow carries no compiled Postgres dependency.
pg = [
    "psycopg[binary]>=3.3.4",
]

[tool.ruff]
# Also read by scripts/check_trailing_commas.py at run time: a collapse must fit this width,
# measured in ruff's display columns (an emoji is 2), not E501's 110.
line-length = 99
target-version = "py310"

[tool.ruff.format]
# Fenced blocks in .md are verbatim example content, so the formatter owns .py only.
exclude = ["*.md"]

[tool.ruff.lint]
# Every stable rule is either selected here or named in `ignore` below (docs/ruffing.md
# keeps the count): a family is selected whole and its codes that still report are ignored.
select = [
    "A",      # flake8-builtins
    "AIR",    # Airflow
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments (contractual resolver/fixture args carry noqa)
    "ASYNC",  # flake8-async: async/await antipatterns (blocking calls in async, etc.)
    "B",      # flake8-bugbear: likely bugs (mutable defaults, bad except order, etc.)
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe
    # COM812 only adds commas to constructs already split across lines;
    # scripts/check_trailing_commas.py owns single-line explode/collapse
    # (docs/ruffing.md "Custom formatter interplay").
    "COM",    # flake8-commas (COM812 pairs with the formatter's magic trailing comma)
    "CPY",    # flake8-copyright
    "D",      # pydocstyle (Google convention)
    "D204",   # blank line after a class docstring (outside the Google convention)
    "D215",   # over-indented section underline (ditto)
    "D400",   # summary ends with a period (the Google convention drops it from a `D` prefix select)
    "D401",   # summary in the imperative mood (ditto)
    "D404",   # summary does not start with "This" (ditto)
    "D406",   # section name ends with a newline (ditto)
    "D407",   # dashed section underline (ditto)
    "D408",   # section underline on the line after the name (ditto)
    "D409",   # section underline length (ditto)
    "DJ",     # flake8-django
    "DTZ",    # flake8-datetimez: naive datetimes
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "ERA",    # eradicate
    "EXE",    # flake8-executable: shebang vs executable bit
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FAST",   # FastAPI
    "FBT",    # flake8-boolean-trap
    "FIX",    # flake8-fixme: FIXME/XXX/HACK markers (TODO is the anchor convention)
    "FLY",    # flake8-flynt: static str .join() -> f-string
    "FURB",   # refurb: modernizing rewrites
    "G",      # flake8-logging-format: eager formatting in logging calls
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420
    "INT",    # flake8-gettext
    "ISC",    # flake8-implicit-str-concat (ISC001 joins a concat the layout script collapses)
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "NPY",    # NumPy
    "PD",     # pandas-vet
    "PERF",   # Perflint: perf antipatterns (try/except in loop, manual comprehension)
    "PGH",    # pygrep-hooks: blanket noqa / type: ignore
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI",    # flake8-pyi
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise: raise hygiene (no redundant parens on bare raise)
    "RUF",    # Ruff-specific: unused-noqa (RUF100), mutable-class-default (RUF012), ...
    "S",      # flake8-bandit: security
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TD",     # flake8-todos
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020: sys.version misuse
]
ignore = [
    # Off by design (docs/ruffing.md "Off by design").
    "CPY001", # copyright headers
    "D203",   # blank line before a class docstring: D211 (Google) is the opposite
    "D213",   # summary on the second line: D212 (Google) is the opposite
    "D413",   # blank line after the last section: ditto
    "EM101",  # string literal in the exception constructor: exception-message style only
    "EM102",  # f-string in the exception constructor: ditto
    "FIX002", # TODO markers are the `TODO(spec-NNN slice N)` anchor convention
    "PLC0415", # local imports break import cycles
    "PLR2004", # magic value in comparison
    "SLF001", # private member access: the package shares underscore names across modules
    "TC001",  # first-party import used only in annotations: annotations are read at runtime
    "TC002",  # third-party import used only in annotations: ditto
    "TC003",  # stdlib import used only in annotations: ditto
    "TD003",  # TODO issue link: the anchor names a spec, not an issue
    "TID252", # relative imports inside the package
    "TRY003", # long message passed to the exception constructor
]
# The package logger is re-exported from `django_strawberry_framework`; naming it lets BLE001 see a
# handler that logs the exception.
logger-objects = ["django_strawberry_framework.logger"]

[tool.ruff.lint.mccabe]
# Ratchet at the current maximum: no new function may exceed the most complex one today.
max-complexity = 45

[tool.ruff.lint.flake8-annotations]
# `*args: Any, **kwargs: Any` forwards verbatim to a third-party signature that varies across the
# supported Strawberry range; each site carries its own `# basedpyright:` reason.
allow-star-arg-any = true

[tool.ruff.lint.flake8-import-conventions.aliases]
# ruff's default alias map minus `datetime = dt`: the project imports `datetime` plainly.
"altair" = "alt"
"holoviews" = "hv"
"matplotlib" = "mpl"
"matplotlib.pyplot" = "plt"
"networkx" = "nx"
"numpy" = "np"
"numpy.typing" = "npt"
"pandas" = "pd"
"panel" = "pn"
"plotly.express" = "px"
"polars" = "pl"
"pyarrow" = "pa"
"seaborn" = "sns"
"tensorflow" = "tf"
"tkinter" = "tk"
"xml.etree.ElementTree" = "ET"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-type-checking]
# TC004 fixes an annotation by quoting it, keeping the import under TYPE_CHECKING.
quote-annotations = true

[tool.ruff.lint.flake8-unused-arguments]
# Unused ``*args`` / ``**kwargs`` are signature padding for protocol/forward
# compatibility (Django ``handle(self, *args, **options)``, ``get_queryset(...,
# **kwargs)``, signal receivers), not a real smell — don't flag them. ARG then
# only fires on unused *named* args, where it carries signal.
ignore-variadic-names = true

[tool.ruff.lint.isort]
# Imports are not a layout-script construct: isort's split-on-trailing-comma (default) keeps a
# parenthesized import exploded once it has a trailing comma.
known-first-party = ["django_strawberry_framework"]

[tool.ruff.lint.pep8-naming]
# Django's `classonlymethod` (`View.as_view`) is a classmethod: its first argument is `cls`.
classmethod-decorators = ["django.utils.decorators.classonlymethod"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D106",   # `class Meta:` is the documented DRF-style idiom; a docstring on each would be noise
    "D401",   # a test docstring states the contract declaratively ("A two-bound range applies ...")
    "N806",   # a class built by `type(...)` or a factory binds to a PascalCase local, like a class statement
    "RUF012", # Meta `fields = {...}` / `[...]` is the consumer idiom; `ClassVar` is not what a consumer writes
    "S101",   # assert is the pytest idiom
    "DJ008",  # throwaway test models never reach the admin or a shell; a `__str__` on each would be unread code
    "SLOT000", # hostile `str`-subclass fixtures model consumer values, which carry an instance `__dict__`
    "SLOT001", # hostile `tuple`-subclass fixtures, same reason
    "S106",   # fixture credentials, and names (token, secret) that only match the rule's heuristic
    "S107",   # same
    "S603",   # subprocess runs git/uv/ruff/sys.executable by name with a fixed argv
    "S607",   # same
]
"examples/**/*.py" = [
    "D106",   # as in tests/
    "D401",   # as in tests/
    "RUF012", # as in tests/
    "S101",   # assert is the pytest idiom
    "SLOT000", # fakeshop's hostile `str`-subclass fixtures, as in tests/
    "S105",   # the never-deployed example's dev SECRET_KEY, seed password and fixture credentials
    "S106",   # same
]
# A test function's name is its summary; the contract docstring most tests carry is not required.
"tests/**/test_*.py" = ["D102", "D103"]
"examples/**/test_*.py" = ["D102", "D103"]
# makemigrations writes these files; a hand-added docstring is lost on the next regeneration.
"examples/**/migrations/*.py" = ["D"]
# PERF: one-shot build/maintenance scripts are not a performance surface.
# T201: print is the CLI output of scripts and the root tools.
# S603/S607: dev tooling runs the maintainer's own git/uv/ruff/docker/sys.executable by name, with no
# untrusted argv; the package and examples have no subprocess calls and stay checked.
# INP001: these folders deliberately have no `__init__.py` (plain scripts, pytest rootdir-relative
# test modules, and fakeshop's top-level modules on `pythonpath`).
"scripts/**/*.py" = ["PERF", "T201", "INP001", "S603", "S607"]
"line_count.py" = ["T201"]
"docs/dry/export_dry_review.py" = ["T201", "INP001"]
"examples/fakeshop/*.py" = ["INP001"]
"examples/fakeshop/tests/*.py" = ["INP001"]
# UP031: GraphQL query text is all braces; `%s` keeps it readable where `str.format` / f-strings
# double them.
"examples/fakeshop/test_query/**/*.py" = ["INP001", "UP031"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at line-length (99); E501 only flags lines past 110
# -- the grace covers long strings/comments the formatter cannot break. The layout script
# collapses only to line-length (99), never into the 99-110 grace.
max-line-length = 110

[tool.ruff.lint.pylint]
# Ratchets at the current maxima (PLR0911-PLR0917): lower one to list the functions above it.
max-args = 18
max-branches = 39
max-positional-args = 10
max-returns = 20
max-statements = 133

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
# Every .py in the repo (the package's annotations are public via ``py.typed``); the
# excludes are git-ignored scratch trees (docs/shadow/ copies, cycle temp files). tests/
# stays in the root environment, importing fakeshop through the extra path as pytest's
# `pythonpath` does: an environment rooted at tests/ lets tests/rest_framework and
# tests/types shadow DRF and the stdlib.
include = ["."]
extraPaths = ["examples/fakeshop"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "docs/shadow",
    "docs/*/temp-tests",
    "docs/*/worker-memory",
]
# Lowest Python the stubs support (they import `typing.Self`; lower reads every `Self`
# as `Any`). The 3.10 floor is proven by the floor CI cell and pyrightconfig.floor.json,
# which re-checks this scope at 3.10 so a 3.11+ stdlib or `typing` name fails.
pythonVersion = "3.11"
# No plugin: only the stubs' and packages' own annotations (every dependency is typed),
# so the package reads as a downstream checker sees it and fakeshop settings are never
# imported. Every rule on (`all`) minus those below; a warning fails the run.
typeCheckingMode = "all"
failOnWarnings = true
# The one suppression is a rule-scoped `# pyright: ignore[<rule>]`; `# type: ignore`
# is not read, and a suppression the run does not need is an error.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
# Off by design: the formatter's multi-line strings are implicit concatenation (ruff bans
# only `+`, ISC003); a private helper another package module imports reads as unused in
# its own; import cycles are broken by local imports; metaclass, descriptor and Django
# model attributes are declared annotation-only (reverse accessors, key columns,
# `__slots__`), which reads as uninitialized.
reportImplicitStringConcatenation = "none"
reportPrivateUsage = "none"
reportUnusedFunction = "none"
reportImportCycles = "none"
reportUninitializedInstanceVariable = "none"
# The ratchet, off until their sites are fixed (turn one on to list them): `reportAny` is
# on in the scripts/ and root-file environments below, the last two in those and the
# package's.
reportAny = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"

# An environment's root resolves imports first. Scripts run as `python
# scripts/<name>.py`: sibling imports from the root, plus the repo root (first-party, not
# the editable install) and fakeshop (resolved statically, never executed).
[[tool.basedpyright.executionEnvironments]]
root = "scripts"
extraPaths = ["examples/fakeshop", "."]
reportAny = "error"
reportUnannotatedClassAttribute = "error"
reportUnusedCallResult = "error"

# Listed before the package root: rooted at the package, rest_framework/ would shadow
# DRF for its own modules.
[[tool.basedpyright.executionEnvironments]]
root = "django_strawberry_framework/rest_framework"
extraPaths = ["."]
reportUnannotatedClassAttribute = "error"
reportUnusedCallResult = "error"

[[tool.basedpyright.executionEnvironments]]
root = "django_strawberry_framework"
extraPaths = ["."]
reportUnannotatedClassAttribute = "error"
reportUnusedCallResult = "error"

# Python files outside the package, scripts/, tests/ and examples/ each take an
# environment rooted at the file: a file root adds no import root, so with these extra
# paths they resolve as the root environment does (a docs/dry root would search docs/dry
# first and name the module export_dry_review).
[[tool.basedpyright.executionEnvironments]]
root = "conftest.py"
extraPaths = [".", "examples/fakeshop"]
reportAny = "error"
reportUnannotatedClassAttribute = "error"
reportUnusedCallResult = "error"

[[tool.basedpyright.executionEnvironments]]
root = "line_count.py"
extraPaths = [".", "examples/fakeshop"]
reportAny = "error"
reportUnannotatedClassAttribute = "error"
reportUnusedCallResult = "error"

[[tool.basedpyright.executionEnvironments]]
root = "docs/dry/export_dry_review.py"
extraPaths = [".", "examples/fakeshop"]
reportAny = "error"
reportUnannotatedClassAttribute = "error"
reportUnusedCallResult = "error"

[[tool.basedpyright.executionEnvironments]]
root = "examples/fakeshop"

[tool.coverage.run]
source = ["django_strawberry_framework"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "^\\s*if (typing\\.)?TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
