# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
[project]
name = "django-strawberry-framework"
# The release is single-sourced in ``django_strawberry_framework/__init__.py``
# (``__version__``); hatchling derives the packaging metadata from it via the
# ``[tool.hatch.version]`` table below, so there is no second version literal
# to keep in lockstep.
dynamic = ["version"]
description = "A DRF-inspired Django integration framework for Strawberry GraphQL — filtering, ordering, aggregation, and permissions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
authors = [
    { name = "Rio Weber", email = "riodweber@gmail.com" },
]
maintainers = [
    { name = "Rio Weber", email = "riodweber@gmail.com" },
]
keywords = ["django", "strawberry", "graphql", "filters", "framework", "drf"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dependencies = [
    "Django>=5.2.16",
    # 0.322.2 is the first release whose ``SliceMetadata.from_arguments`` ends a
    # ``first`` + ``before`` page at the cursor (``end = min(end, start + first)``);
    # 0.316.0 through 0.322.1 start that page one row before the cursor and ignore
    # ``after``, and ``utils/connections.py::page_arguments`` turns every
    # ``before`` page without ``first``/``last`` into ``first=cap``. The floor also
    # keeps per-operation extension isolation (spec-044 Decision 6, from 0.316.0):
    # earlier releases cache class-created sync extensions on
    # ``Schema._sync_extensions``, so concurrent requests share one instance's
    # engine-owned ``execution_context``.
    "strawberry-graphql>=0.322.2",
    # Strawberry allows ``graphql-core<3.4.0``, but 3.3.0 rewrites execution into
    # ``graphql.execution.executor`` and drops ``ExecutionContext`` from
    # ``graphql.execution.execute``, which ``schema.py`` imports and
    # ``_graphql_core_patches`` patches. Every 3.2.x release (3.2.0 through 3.2.13)
    # carries each graphql-core name the package imports; the floor is Strawberry's own.
    "graphql-core>=3.2.0,<3.3",
    "django-filter>=25.2",
    # ``typing_extensions.override`` marks every method that overrides a base
    # (``typing.override`` is 3.12+); 4.4.0 is the release that added it.
    "typing-extensions>=4.4.0",
]

[project.urls]
Homepage = "https://pypi.org/project/django-strawberry-framework"
Repository = "https://github.com/riodw/django-strawberry-framework"
Issues = "https://github.com/riodw/django-strawberry-framework/issues"

[dependency-groups]
dev = [
    # cryptography is a SOFT dependency of the package: only Meta.cursor_field
    # needs AES-SIV. The dev group installs it so keyset tests exercise the
    # present path while ordinary consumers avoid a compiled dependency.
    "cryptography>=44.0.0",
    "djangorestframework>=3.17.0",
    "faker>=33.0.0",
    "pillow>=10.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    # channels is a SOFT dependency of the package ([project].dependencies is
    # untouched); the dev group installs it (with Channels' own [daphne] extra,
    # required only to IMPORT channels.testing) so tests/test_routers.py can
    # exercise the channels-present path (spec-041 Decision 5).
    "channels[daphne]>=4.3.2",
    # django-debug-toolbar is a SOFT dependency of the package ([project].dependencies
    # is untouched); the dev group installs it so tests/middleware/test_debug_toolbar.py
    # can exercise the toolbar-present path (spec-042 Decision 5). The >=7.0.0 floor is
    # deliberately above upstream's >=6.0.0: 7.0.0 is the first release carrying the
    # Framework :: Django :: 6.0 classifier the package itself advertises.
    "django-debug-toolbar>=7.0.0",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.5.2",
    "pytest-xdist>=3.8.0",
    # PyYAML is a test-only dependency, and NOT a dependency of the package
    # ([project].dependencies is untouched): tests/test_ci_governance.py parses
    # .github/workflows/*.yml structurally so the least-privilege permission
    # scopes, immutable action/image pins, and per-job timeouts are asserted
    # rather than reviewed by eye (spec-049 Decision 6).
    "pyyaml>=6.0.2",
    "ruff>=0.15.0",
    # ``scripts/`` read pyproject.toml with it: the scripts run on the 3.10 floor cell,
    # where the stdlib ``tomllib`` does not exist yet.
    "tomli>=2.4.1",
    # The package ships ``py.typed``, so its annotations are a public contract
    # that downstream type checkers consume. basedpyright (config in
    # ``[tool.basedpyright]``) checks them, with the Django and DRF stubs so
    # framework types are real rather than ``Any``.
    "django-stubs>=6.0.9",
    # Runtime half of the stubs: the fakeshop settings call its ``monkeypatch()``
    # so example classes can subscript bases Django keeps non-generic at runtime
    # (``admin.ModelAdmin[Card]``, ``forms.ModelForm[Item]``).
    "django-stubs-ext>=6.0.9",
    "djangorestframework-stubs>=3.18.0",
    "basedpyright>=1.40.1",
    # typeshed stubs for two libraries the package subclasses: django-filter (a hard
    # dependency; the filters family) and channels (a soft one; the WebSocket consumer
    # and router). Each
    # stub release names the upstream line it covers (``26.1.*`` / ``4.3.*``), so
    # bump it with the library. django-debug-toolbar ships its own ``py.typed``.
    "types-django-filter>=26.1.0.20260906",
    "types-channels>=4.3.0.20260518",
]
# Postgres test tier (opt-in): ``uv sync --group pg`` adds the driver the
# ``FAKESHOP_PG_DSN`` settings branch needs. Kept out of ``dev`` so the
# default sqlite workflow carries no compiled Postgres dependency.
pg = [
    "psycopg[binary]>=3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The one version source: hatchling reads ``__version__`` from the package
# init (default regex source) for sdist/wheel metadata and any direct build.
[tool.hatch.version]
path = "django_strawberry_framework/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["django_strawberry_framework"]

[tool.hatch.build.targets.sdist]
# Ship the package, tests, and key metadata only. Without this, hatchling's default
# sdist tars the whole tree — internal docs/SPECS, examples/ (with sqlite DBs), and
# any local .claude/ state — into a ~7 MB archive.
include = [
    "/django_strawberry_framework",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 99
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    "venv",
    ".venv",
    "env",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
]

[tool.ruff.format]
# ruff 0.16 formats Python blocks inside Markdown. Fenced blocks in this repo are
# verbatim example content (see START.md "Markdown link convention"), and the
# archived specs under docs/SPECS/ are a historical record, so the formatter owns
# .py only.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "ANN",    # flake8-annotations
    "A",      # flake8-builtins
    "ARG",    # flake8-unused-arguments (contractual resolver/fixture args carry noqa)
    "ASYNC",  # flake8-async: async/await antipatterns (blocking calls in async, etc.)
    "B",      # flake8-bugbear: likely bugs (mutable defaults, bad except order, etc.)
    "N",      # pep8-naming
    "C4",     # flake8-comprehensions
    "COM812", # flake8-commas: missing-trailing-comma (pairs with magic trailing comma in formatter)
    "D",      # pydocstyle
    "ERA",    # eradicate
    "FLY",    # flake8-flynt: static str .join() -> f-string
    "ISC003", # explicit-str-concat only (ISC001/002 conflict with the formatter)
    "PERF",   # Perflint: perf antipatterns (try/except in loop, manual comprehension)
    "PLE",    # Pylint errors only (E-level; PLR/PLW/PLC excluded as noisy/opinionated)
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise: raise hygiene (no redundant parens on bare raise)
    "RUF",    # Ruff-specific: unused-noqa (RUF100), mutable-class-default (RUF012), ...
    "SIM",    # flake8-simplify
    "TRY004", # tryceratops: raise TypeError (not a vanilla error) on a type-check failure
    "UP",     # pyupgrade
]
ignore = [
    "ANN002", # Missing type annotation for *args
    "ANN003", # Missing type annotation for **kwargs
    "ANN401", # Any type annotation
    "D107",   # Missing docstring in __init__
    "D417",   # Missing argument description in docstring
    "RUF001", # ambiguous-unicode in strings — em-dashes/arrows are intentional here
    "RUF002", # ambiguous-unicode in docstrings — ditto
    "RUF003", # ambiguous-unicode in comments — ditto
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# B018 (useless-expression): bare ``factory.arguments`` triggers the lazy
# build/raise under test. RUF012 (mutable-class-default): test/example fixture
# classes use mutable attrs idiomatically. PERF: perf of test/example code is
# irrelevant. ARG: in test code an "unused argument" is almost always an
# injected pytest fixture (used for its side effect) or a framework-fixed
# resolver/hook signature — both are required to be present, so ARG is noise
# here; it stays enforced on the PACKAGE, where an unused named arg is a real
# signal. RUF043 (pytest match= metacharacters): plain `match="...with a
# period..."` is the dominant convention (147 vs 20 raw) and matches error
# substrings fine; forcing raw strings would tax every test.
"tests/**/*.py" = ["D", "ANN", "ERA001", "F841", "SIM117", "SIM118", "E501", "N802", "N806", "B018", "RUF012", "PERF", "RUF043", "ARG"]
"examples/**/*.py" = ["D", "ANN", "ERA001", "F841", "SIM117", "SIM118", "E501", "UP031", "N806", "B018", "RUF012", "PERF", "RUF043", "ARG"]
# PERF: one-shot build/maintenance scripts are not a performance surface.
"scripts/**/*.py" = ["PERF"]
"**/migrations/*.py" = ["D100", "D101", "D104"]
"**/views.py" = ["D101"]
"**/urls.py" = ["D100"]
"**/admin.py" = ["D101"]

[tool.ruff.lint.flake8-unused-arguments]
# Unused ``*args`` / ``**kwargs`` are signature padding for protocol/forward
# compatibility (Django ``handle(self, *args, **options)``, ``get_queryset(...,
# **kwargs)``, signal receivers), not a real smell — don't flag them. ARG then
# only fires on unused *named* args, where it carries signal.
ignore-variadic-names = true

[tool.ruff.lint.isort]
known-first-party = ["django_strawberry_framework"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at line-length (99); E501 only flags lines past 110
# -- the grace covers long strings/comments the formatter cannot break.
max-line-length = 110

# basedpyright checks the shipped package (``py.typed`` makes its annotations public)
# and the ``scripts/`` tooling that gates it, and a warning fails the run. A script runs
# as ``python scripts/<name>.py``, so its execution environment is rooted at
# ``scripts/`` (sibling imports such as ``_kanban_lib``) with the repo root (``scripts.*``
# and package imports as first-party source, not through the editable install) and the
# fakeshop project on the path (``apps.*`` / ``config.*`` imports, resolved statically,
# never executed). No
# plugin exists or is wanted: the check reads only the stubs' and packages' own
# annotations, so it sees the package exactly as a downstream checker does and never
# imports the example project's settings. Every dependency is typed (its own
# ``py.typed``, django-stubs, or the typeshed stubs in the ``dev`` group).
# ``pythonVersion`` is the lowest Python the installed stubs support (they import
# ``typing.Self``); a lower one would read every ``Self`` return as ``Any``. The
# package's own 3.10 floor is proven by the floor CI cell running the suite on 3.10, and
# ``pyrightconfig.floor.json`` (which extends this table) re-checks its scope at 3.10
# so a 3.11+ stdlib or ``typing`` name fails when it is written. The one suppression is
# ``# pyright: ignore[<rule>]``, always rule-scoped: ``# type: ignore`` is not read at
# all, and a suppression the run does not need is itself an error.
[tool.basedpyright]
# Every Python file in the repository except the package tests under tests/. The other
# excludes are git-ignored scratch trees: generated source copies (docs/shadow/) and the
# throwaway files a review, build, DRY or bug-hunt cycle creates and deletes at closeout.
include = ["."]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "tests",
    "docs/shadow",
    "docs/*/temp-tests",
    "docs/*/worker-memory",
]
executionEnvironments = [
    { root = "scripts", extraPaths = ["examples/fakeshop", "."] },
    { root = "examples/fakeshop" },
]
pythonVersion = "3.11"
# Every rule on (`all`), minus the rules and flags below; a warning fails the run.
typeCheckingMode = "all"
failOnWarnings = true
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
# Off by design. The formatter's multi-line string layout is implicit concatenation
# (ruff bans only the explicit `+` form, ISC003); the package shares underscore names
# across its own modules, so a private helper another module imports reads as unused
# in its own; import cycles are broken at runtime by local imports; and attributes a
# metaclass, descriptor or Django's model machinery sets are declared annotation-only
# (reverse accessors, key columns, `__slots__` entries), which reads as uninitialized.
reportImplicitStringConcatenation = "none"
reportPrivateUsage = "none"
reportUnusedFunction = "none"
reportImportCycles = "none"
reportUninitializedInstanceVariable = "none"
# Off until their remaining sites are fixed (the ratchet): turn one on to list them.
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"
reportMissingParameterType = "none"
reportUnusedParameter = "none"

[tool.coverage.run]
source = ["django_strawberry_framework"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
